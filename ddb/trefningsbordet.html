<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trefningsbordet · De Dødes Bok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: blekk-ramme rundt et pergamentbord. Øverst kartet med brikker, under det rundens prosedyre steg for steg. Faner: Trefning, Søkere, Fiender, Simuler, Regler. Fast fanelinje nederst på telefon. */
:root{
  color-scheme: light;
  --ink:#16110e; --ink2:#2c231e; --paper:#eee4d1; --paper2:#e2d5bc; --paper3:#d4c4a5; --bone:#f8f2e6;
  --blood:#8c2a1f; --blood2:#651b13; --gilt:#94732b; --verd:#3e6a50; --ghost:#3c5779; --grey:#5a4e45; --line:#b9a98b;
  --disp:"Grenze Gotisch","Old English Text MT",serif;
  --cap:"IM Fell English SC","EB Garamond",Georgia,serif;
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
  --tabh:64px;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--ink);margin:0}
body{font-family:var(--serif);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
.num,.tab-num{font-variant-numeric:lining-nums tabular-nums}

/* Hode */
header{padding:10px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;color:var(--bone);border-bottom:1px solid #3b302a}
header h1{margin:0;font-family:var(--disp);font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1;letter-spacing:.01em}
header h1 small{font-family:var(--cap);font-size:13px;letter-spacing:.14em;color:#b9ab95;margin-left:10px;vertical-align:middle}
header .round{font-family:var(--cap);font-size:14px;letter-spacing:.1em;color:#d9cdb6;white-space:nowrap}
header .round b{color:#e7a08f;font-weight:400}

header h1 .logo{height:clamp(36px,7vw,50px);width:auto;display:block}
header h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tok .disc.img{width:94%;height:94%;color:transparent;border:4px solid transparent!important;background:var(--im) center/cover no-repeat padding-box,conic-gradient(var(--ring) var(--hp),var(--track) 0) border-box!important}
.tok.s .disc.img,.tok.h .disc.img{--ring:#efe3c8;--track:#5a4c3e;box-shadow:0 0 0 1.5px var(--ink),0 2px 3px rgba(0,0,0,.4)}
.tok.h .disc.img{width:74%;height:74%;border-width:3px!important}
.tok.h .disc.img{--ring:#c8322a;--track:#4a3f35}
.tok.m .disc.img{--ring:#7a1810;--track:#2a0805;box-shadow:0 0 0 1.5px #1c0603,0 2px 3px rgba(0,0,0,.4)}
.tok .disc.img .hp{display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 0;font-size:13px;color:var(--grey);font-style:italic}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px}
.legend .lr{background:#c8322a}.legend .lb{background:#4f78ad}
.legend .ld{width:7px;height:7px;background:#16110e;transform:rotate(45deg);border-radius:0}
.legend .lg{width:8px;height:8px;background:#6d3f8f;border-radius:50%}
.tok .wd{position:absolute;left:-5px;top:12%;display:flex;flex-direction:column;gap:2px;z-index:2}
.tok .wd i{display:block;width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--bone);box-shadow:0 0 0 1px var(--ink)}
.tok .wd i.b{background:#16110e}
.tok .wd i.g{background:#6d3f8f;border-radius:50%;transform:none}
@media (max-width:700px){.tok .wd i{width:6px;height:6px;border-width:1px}}
.tok.s .disc.img.duo{background:var(--im) center/cover no-repeat padding-box,conic-gradient(#4f78ad 0deg var(--hf),#4a3f35 var(--hf) 180deg,#4a3f35 180deg calc(360deg - var(--hl)),#c8322a calc(360deg - var(--hl)) 360deg) border-box!important}
.tok.m .disc:not(.img){border:3px solid #b3261e}
.tok.s .disc:not(.img){border:3px solid #e9dcc2;box-shadow:0 0 0 2px var(--ink)}
.tok .disc.img .tg{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-family:var(--cap);font-size:10.5px;letter-spacing:.04em;line-height:13px;padding:0 4px;border-radius:2px;background:var(--ink);color:var(--bone);white-space:nowrap}
.tok.m .disc.img .tg{background:#5e130c}
@media (max-width:700px){.tok .disc.img .tg{font-size:8px;line-height:10px;padding:0 3px;bottom:-9px}.tok .disc.img{border-width:3px!important}}

.tok.down .disc.img{filter:grayscale(1) brightness(.6)}
.mav{width:18px;height:18px;border-radius:50%;object-fit:cover;vertical-align:-4px;margin-right:3px;border:1px solid var(--ink2)}
.turn{position:relative}
.tface{position:absolute;right:10px;top:10px;width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--ink);box-shadow:1px 1px 0 var(--ink)}
.turn.m .tface{border-color:var(--blood)}
.turn .tn,.turn .ts,.turn .tl{padding-right:76px}
img.sigil.face{object-fit:cover;padding:0}
.cardart{height:150px;margin:-12px -14px 10px;background-size:cover;background-position:center 25%;border-bottom:1.5px solid var(--ink);border-radius:2px 6px 0 0}
.cardart.m{background-position:center 35%}
.banner{height:120px;border:1.5px solid var(--ink);border-radius:4px;background-size:cover;background-position:center 40%;display:flex;align-items:flex-end;margin-bottom:12px;box-shadow:1px 1px 0 var(--ink);position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,17,14,0) 35%,rgba(22,17,14,.82))}
.banner span{position:relative;z-index:1;color:var(--bone);font-family:var(--cap);font-size:20px;letter-spacing:.12em;padding:10px 14px}
.banner.kl{background-position:center 30%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:860px) and (min-width:901px){.steps small{display:none}.steps div{padding:6px 2px}.turn{padding:8px 12px}.hint1{margin-bottom:2px}}
.barbtn{background:var(--blood);color:var(--bone);border:1px solid #b9564a;border-radius:3px;font-family:var(--cap);font-size:13px;letter-spacing:.06em;padding:2px 10px}
.a-tools .seg.scenes{width:100%;display:flex}.a-tools .seg.scenes button{flex:1}
@media (min-width:901px){.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;align-items:start}.result .head{grid-column:1/-1}.result .dicewrap{grid-row:2/span 3}.die{width:30px;height:30px;font-size:16px}.dicebrk span{left:calc(var(--lo)*36px);width:calc(3*30px + 2*6px)}}
/* Faner */
nav.tabs{display:flex;justify-content:center;gap:2px;background:var(--ink);border-bottom:1px solid #3b302a;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:#b9ab95;font-family:var(--cap);font-size:15px;letter-spacing:.12em;padding:12px 14px 10px}
nav.tabs button.on{color:var(--bone);border-bottom-color:var(--blood)}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;border-top:1px solid #3b302a;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);justify-content:space-around}
  nav.tabs button{flex:1;padding:10px 2px 12px;font-size:13px;letter-spacing:.06em;border-bottom:0;border-top:3px solid transparent}
  nav.tabs button.on{border-top-color:var(--blood)}
  main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px)!important}
}
main{background:var(--paper);min-height:80vh;padding:12px 16px 24px}
.wrap{max-width:1180px;margin:0 auto}
section.view{display:none}section.view.on{display:block}

/* Blekkbokser i Ashborn-ånd */
.box{background:var(--bone);border:1.5px solid var(--ink);border-radius:3px 7px 4px 6px/6px 4px 7px 3px;box-shadow:1px 1px 0 var(--ink);padding:12px 14px;position:relative;min-width:0}
.box.head{padding-top:42px}
.box.head>.bar{position:absolute;left:-1px;top:-1px;right:-1px;height:30px;background:var(--ink);color:var(--bone);font-family:var(--cap);font-size:15px;letter-spacing:.14em;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:2px 6px 0 0}
.box.head>.bar span:last-child{font-size:13px;color:#cbbfa9;letter-spacing:.06em}
h2{font-family:var(--cap);font-weight:400;font-size:18px;letter-spacing:.12em;margin:0}
.sub{font-style:italic;color:var(--grey);margin:2px 0 14px}
.lab{font-family:var(--cap);font-size:13px;letter-spacing:.12em;color:var(--grey);margin:12px 0 6px;display:flex;justify-content:space-between;gap:8px}
.lab i{font-family:var(--serif);letter-spacing:0;font-size:14px}
.muted{color:var(--grey);font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--bone);border:1.5px solid var(--ink);border-radius:3px 5px 3px 5px/5px 3px 5px 3px;box-shadow:1px 1px 0 var(--ink);padding:8px 14px;font-family:var(--cap);font-size:15px;letter-spacing:.08em;min-height:40px}
.btn:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.btn.dark{background:var(--ink);color:var(--bone)}
.btn.blood{background:var(--blood);color:var(--bone);border-color:var(--blood2);box-shadow:1px 1px 0 var(--blood2)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:32px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;box-shadow:1px 1px 0 var(--ink)}
.seg button{border:0;background:var(--bone);padding:7px 10px;font-family:var(--cap);font-size:14px;letter-spacing:.04em;min-height:38px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--bone)}
select.sel,input.inp{border:1.5px solid var(--ink);background:var(--bone);border-radius:3px;padding:6px 8px;min-height:38px;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:15px}

/* Trefning-oppsett: kart til venstre, prosedyre til høyre, stripen og stedsvalget over */
.table{--mapw:min(560px,calc((100vh - 270px) * var(--cols) / var(--rows)));display:grid;grid-template-columns:var(--mapw) minmax(0,1fr);grid-template-areas:"tools mini" "map proc";gap:10px 18px;align-items:start}
.table>*{min-width:0}
.a-mini{grid-area:mini;position:sticky;top:46px;z-index:20;align-self:start}
.a-tools{grid-area:tools;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.a-map{grid-area:map}
.a-proc{grid-area:proc}
@media (max-width:900px){
  .table{--mapw:min(100%,calc(36svh * var(--cols) / var(--rows)));grid-template-columns:minmax(0,1fr);grid-template-areas:"mini" "map" "proc" "tools"}
  .a-mini{top:0}
  .a-map .map{width:var(--mapw);margin:0 auto}
  .a-tools{justify-content:center}
  .steps small{display:none}
  .steps div{padding:6px 2px}
  .turn .tn{font-size:22px}
  .die{width:30px;height:30px;font-size:16px}
  .dicebrk span{left:calc(var(--lo)*36px);width:calc(3*30px + 2*6px)}
  .out{font-size:20px}
  .result .head{font-size:14px}
  .eff{font-size:14.5px}
  .box.head{padding:38px 10px 10px}
}
.a-mini .mini{position:static;margin:0;padding:0 0 2px}
.pickline{font-size:14.5px;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.pickline b{font-family:var(--cap);font-weight:400;font-size:16px;letter-spacing:.04em}
.pickline .warn{color:var(--blood)}
.pickline .adj{margin-left:auto;display:inline-flex;gap:4px}
.hint1{font-size:14.5px;color:var(--grey);font-style:italic;margin:0 0 6px}
.mand{flex-basis:100%;font-size:14px}
.turn{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;border:2px solid var(--ink);border-radius:5px;background:var(--paper2);padding:10px 12px;box-shadow:2px 2px 0 var(--ink)}
.turn.m{border-color:var(--blood);box-shadow:2px 2px 0 var(--blood2);background:#ecd9cc}
.turn .tl{font-family:var(--cap);font-size:12.5px;letter-spacing:.14em;color:var(--grey)}
.turn .tn{font-family:var(--cap);font-size:26px;letter-spacing:.04em;line-height:1.1}
.turn.m .tn{color:var(--blood)}
.turn .ts{font-size:15px;color:var(--ink2)}
.turn .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.btn.big{font-size:17px;padding:8px 22px;min-height:44px}
.queue{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.q{font-family:var(--cap);font-size:13px;letter-spacing:.04em;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--grey)}
.q.now{border-color:var(--ink);background:var(--ink);color:var(--bone)}
.q.done{text-decoration:line-through;opacity:.6}
.q.dodged{font-style:italic}
.btn.ghost{background:none;box-shadow:none;border-color:var(--line);margin-left:auto}
.rulechips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.rulechips .rl{font-family:var(--cap);font-size:13px;letter-spacing:.1em;color:var(--grey);margin-right:2px}
.rc{font-family:var(--cap);font-size:13px;letter-spacing:.04em;border:1.5px solid var(--ink);background:var(--bone);border-radius:20px;padding:3px 10px;min-height:30px}
.rc.on{background:var(--ink);color:var(--bone)}
.rc.open{box-shadow:0 0 0 2px var(--gilt)}
.rc .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gilt);margin-right:5px;vertical-align:1px}
.rpanel{margin-top:8px;border:1.5px solid var(--ink);border-radius:4px;background:var(--bone);padding:8px 10px;box-shadow:1px 1px 0 var(--ink);font-size:14.5px}
.rpanel p{margin:4px 0}
.rph{display:flex;align-items:center;gap:8px}
.rph b{font-family:var(--cap);font-weight:400;font-size:15px;letter-spacing:.04em}
.rph .rk,.rk{font-family:var(--cap);font-size:11.5px;letter-spacing:.06em;color:var(--grey);border:1px solid var(--line);border-radius:10px;padding:0 6px}
.rx{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;padding:0 4px;color:var(--grey)}
.rex{color:var(--grey);font-style:italic}
.rnote{color:var(--blood)}
.rseg{margin-top:4px}
.rseg button{min-height:34px;font-size:13.5px}
.why{font-size:13.5px;color:var(--ink2);margin:2px 0 0}
.pre{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px}
.mchip{font-family:var(--cap);font-size:12.5px;letter-spacing:.06em;border:1.5px solid var(--ink2);border-radius:3px;padding:0 6px;background:var(--bone)}
.mchip.ulempe{border-color:var(--blood);color:var(--blood)}
.mchip.fordel{border-color:var(--verd);color:var(--verd)}
.mwhy{font-size:14px;color:var(--ink2)}
.ruleinfo{margin-top:6px;font-size:14px;display:grid;gap:4px}
.ruleinfo div{border-left:3px solid var(--ink);background:var(--paper2);padding:4px 8px}
.ruleinfo b{font-family:var(--cap);font-weight:400;letter-spacing:.04em}
.ruleinfo .rk{font-family:var(--cap);font-size:11.5px;letter-spacing:.06em;color:var(--grey);margin-left:6px;border:1px solid var(--line);border-radius:10px;padding:0 6px}
.ruleinfo.none{color:var(--grey);font-style:italic;margin:6px 0 0}
details.logd{margin-top:10px}
details.logd summary{cursor:pointer;font-family:var(--cap);font-size:14px;letter-spacing:.1em;padding:6px 0}
.result{margin-top:10px;padding-top:8px}
.die{width:34px;height:34px;font-size:18px}
.dicebrk span{left:calc(var(--lo)*40px);width:calc(3*34px + 2*6px)}

/* Kart */
.mapbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.seg.scenes button{font-size:15px;padding:8px 12px;min-height:44px}
@media (max-width:420px){.seg.scenes button{padding:8px 8px;font-size:14px}}
.mapname{position:absolute;left:8px;bottom:8px;z-index:0;opacity:.85;background:var(--ink);color:var(--bone);font-family:var(--cap);font-size:13px;letter-spacing:.1em;padding:2px 8px;border-radius:2px;pointer-events:none}
.map{position:relative;width:100%;aspect-ratio:var(--cols)/var(--rows);border:1.5px solid var(--ink);box-shadow:1px 1px 0 var(--ink);border-radius:4px;overflow:hidden;background:#e9dcc2;touch-action:none;user-select:none;-webkit-user-select:none}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tok{position:absolute;width:calc(100%/var(--cols));height:calc(100%/var(--rows));display:grid;place-items:center;touch-action:none;transition:left .12s,top .12s}
.tok.drag{transition:none;z-index:9}
.tok .disc{width:84%;height:84%;border-radius:50%;display:grid;place-items:center;font-family:var(--cap);font-size:clamp(11px,3.2vw,16px);letter-spacing:.02em;border:2px solid var(--ink);box-shadow:0 2px 0 rgba(22,17,14,.35);position:relative}
.tok.s .disc{background:var(--bone);color:var(--ink)}
.tok.h .disc{background:#d8c9a8;color:var(--ink);width:66%;height:66%}
.tok.m .disc{background:var(--blood);color:var(--bone);border-color:var(--blood2)}
.zone{position:absolute;width:calc(100%/var(--cols));height:calc(100%/var(--rows));background:rgba(148,115,43,.22);box-shadow:inset 0 0 0 1px rgba(148,115,43,.35);pointer-events:none}
.zone.edge{box-shadow:inset 0 0 0 1.5px rgba(148,115,43,.75)}
.zone.m{background:rgba(140,42,31,.18);box-shadow:inset 0 0 0 1px rgba(140,42,31,.3)}
.zone.m.edge{box-shadow:inset 0 0 0 1.5px rgba(140,42,31,.7)}
.tok.inr .disc{box-shadow:0 0 0 3px var(--bone),0 0 0 5px var(--gilt)}
.tok.m.inr .disc{box-shadow:0 0 0 3px var(--bone),0 0 0 5px var(--blood)}
.tgtlab{font-family:var(--cap);font-size:14px;letter-spacing:.1em;color:var(--blood)}
.tgtsel{border-color:var(--blood)!important;box-shadow:0 0 0 1px var(--blood)}
.actor .arrow{color:var(--blood);font-family:var(--serif)}
.actor .tgtname{font-family:var(--cap);color:var(--blood)}
.tok.tgt .disc{box-shadow:0 0 0 2px var(--bone),0 0 0 4.5px var(--blood),0 0 10px 4px rgba(140,42,31,.45)}
.tgtmark{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;background:var(--blood);color:var(--bone);font-family:var(--cap);font-size:10px;letter-spacing:.08em;padding:0 4px;border-radius:2px;line-height:14px;white-space:nowrap}
.mini{display:flex;gap:6px;overflow-x:auto;background:var(--paper);scrollbar-width:thin;padding-bottom:2px}
.mc{flex:1 0 auto;max-width:200px;display:grid;gap:2px;justify-items:start;text-align:left;background:var(--bone);border:1.5px solid var(--ink);border-radius:4px;padding:4px 6px 5px;min-width:0;box-shadow:1px 1px 0 var(--ink)}
.mc.m{border-color:var(--blood2)}
.mc.sel{outline:2px solid var(--gilt);outline-offset:1px}
.mc.down{opacity:.45}
.mc .mt{font-family:var(--cap);font-weight:400;background:var(--ink);color:var(--bone);border-radius:2px;padding:0 3px;margin-right:2px}
.mc.m .mt{background:var(--blood)}
.mc .mn{font-family:var(--cap);font-size:12px;letter-spacing:.04em;line-height:1.1;white-space:nowrap}
.mc.m .mn{color:var(--blood)}
.mb{display:flex;gap:1.5px;align-items:center}
.mb i{display:block;width:7px;height:7px;border:1px solid var(--ink2);background:var(--bone);border-radius:1px}
.mb i.l.on{background:var(--blood);border-color:var(--blood2)}
.mb i.f.on{background:var(--ghost);border-color:#2a3e58}
.mb i.b,.mb i.g{width:6px;height:6px;border-radius:50%}
.mb i.b{border-radius:0;transform:rotate(45deg);width:5px;height:5px;margin:0 1px}
.mb i.b.on{background:var(--ink)}
.mb i.g.on{background:#6d3f8f;border-color:#3f2154}
.mb em{width:4px}
.tok.sel .disc{outline:3px solid var(--gilt);outline-offset:1px}
.tok.down .disc{background:#9b8f7f;color:#e9e1d1;border-color:#6d6257}
.tok.down .disc:after{content:"";position:absolute;inset:12%;background:linear-gradient(45deg,transparent 46%,var(--ink) 46%,var(--ink) 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--ink) 46%,var(--ink) 54%,transparent 54%)}
.tok.fled{opacity:.25}
.tok .hp{position:absolute;left:14%;right:14%;bottom:4%;height:4px;background:rgba(22,17,14,.35);border-radius:2px;overflow:hidden}
.tok .hp i{display:block;height:100%;background:var(--blood)}
.tok.m .hp i{background:var(--bone)}
.tok .act{position:absolute;top:2%;right:4%;font-family:var(--cap);font-size:10px;background:var(--ink);color:var(--bone);border-radius:3px;padding:0 3px;line-height:14px}

/* Valgt brikke */
.pick{margin-top:10px}
.pick .name{font-family:var(--cap);font-size:18px;letter-spacing:.06em}
.pick .meta{color:var(--grey);font-size:15px}
.track{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.bx{width:24px;height:24px;border:1.5px solid var(--ink);border-radius:2px 4px 2px 4px/4px 2px 4px 2px;background:var(--bone);display:grid;place-items:center;font-size:12px;font-weight:600;font-variant-numeric:lining-nums}
.bx.on{background:var(--blood);color:var(--bone);border-color:var(--blood2)}
.bx.f.on{background:var(--ghost);border-color:#2a3e58}
.bx.mark{width:18px;height:18px}
.bx.mark.on{background:var(--ink);border-color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-family:var(--cap);font-size:12px;letter-spacing:.06em;border:1px solid var(--ink2);border-radius:20px;padding:1px 8px;background:var(--paper2)}
.tag.warn{border-color:var(--blood);color:var(--blood)}

/* Prosedyre */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:12px;box-shadow:1px 1px 0 var(--ink)}
.steps div{padding:7px 2px 6px;text-align:center;font-family:var(--cap);font-size:13px;letter-spacing:.04em;background:var(--bone);border-left:1.5px solid var(--ink);color:var(--grey)}
.steps div:first-child{border-left:0}
.steps div.done{background:var(--paper2);color:var(--ink2)}
.steps div.on{background:var(--ink);color:var(--bone)}
.steps small{display:block;font-family:var(--serif);font-size:11px;letter-spacing:0;font-style:italic;opacity:.8}
.actor{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.actor:last-child{border-bottom:0}
.actor .who{font-family:var(--cap);font-size:16px;letter-spacing:.04em}
.actor .pl{display:flex;align-items:center;gap:6px;margin-top:4px;font-family:var(--serif);font-size:13px;letter-spacing:0;color:var(--grey)}
.actor .pl span{font-style:italic}
.actor .pl input{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;border-bottom:1px dotted var(--grey);padding:1px 2px;width:9em;max-width:100%;border-radius:0}
.actor .pl input:focus{outline:none;border-bottom:1.5px solid var(--blood)}
.actor .who small{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--grey);letter-spacing:0;margin-left:4px}
.actor .ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actor.done{opacity:.55}
.hint{font-size:15px;color:var(--ink2);background:var(--paper2);border-left:3px solid var(--blood);padding:7px 10px;margin:0 0 10px}

/* Kast */
.result{margin-top:12px;border-top:1.5px solid var(--ink);padding-top:10px}
.result .head{font-family:var(--cap);font-size:15px;letter-spacing:.06em}
.dicewrap{margin:8px 0 4px;width:max-content;max-width:100%}
.dice{display:flex;gap:6px}
.dicebrk{position:relative;height:8px;margin-top:3px}
.dicebrk span{position:absolute;top:0;height:6px;left:calc(var(--lo)*44px);width:calc(3*38px + 2*6px);border:1.5px solid var(--ink);border-top:0;border-radius:0 0 4px 4px}
.dicelab{font-family:var(--cap);font-size:12.5px;letter-spacing:.06em;color:var(--grey);margin-top:2px}
.die{width:38px;height:38px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--grey);background:var(--paper);font-variant-numeric:lining-nums}
.die.c{border-color:var(--ink);background:var(--bone);color:var(--ink);box-shadow:1px 1px 0 var(--ink)}
.die.c.six{border-color:var(--gilt);color:var(--gilt);box-shadow:0 0 0 2px var(--bone),0 0 0 3.5px var(--gilt)}
.die.c.one{border-color:var(--blood);color:var(--blood)}
.out{font-family:var(--cap);font-size:24px;letter-spacing:.12em;margin:2px 0}
.out.F{color:var(--blood)}.out.S{color:var(--ink2)}.out.St{color:var(--verd)}.out.FT{color:var(--gilt)}
.out small{font-family:var(--serif);font-size:15px;letter-spacing:0;color:var(--grey);margin-left:6px}
.eff{font-size:15.5px}
.eff b{font-weight:600}
.eff .hurt{color:var(--blood);font-weight:600}
.eff .good{color:var(--verd);font-weight:600}

/* Logg */
.log{max-height:300px;overflow:auto;font-size:14.5px}
.log div{padding:5px 0;border-bottom:1px dotted var(--line)}
.log b{font-family:var(--cap);font-weight:400;letter-spacing:.06em}

/* Kort for roller og monstre */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.pregens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.pg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.pg .sigil{width:44px;height:44px;font-size:24px}
.pg .nm{font-family:var(--cap);font-size:17px;letter-spacing:.04em}
.sheet .top{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.sigil{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--disp);font-size:30px;background:var(--paper2)}
.sigil.m{background:var(--blood);color:var(--bone);border-color:var(--blood2)}
.sheet .nm{font-family:var(--cap);font-size:19px;letter-spacing:.05em;line-height:1.15}
.sheet .tagline{font-style:italic;color:var(--grey);font-size:14.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin-top:10px;font-size:15.5px}
.kv dt{font-family:var(--cap);font-size:13px;letter-spacing:.08em;color:var(--grey);padding-top:2px}
.kv dd{margin:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.form label{display:grid;gap:2px;font-family:var(--cap);font-size:12.5px;letter-spacing:.08em;color:var(--grey)}
.form .full{grid-column:1/-1}
.form label.chk{display:inline-flex;font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:0;gap:6px}
.form select,.form input{width:100%}
.stat{display:flex;gap:14px;margin-top:8px;font-family:var(--cap);letter-spacing:.06em}
.stat b{font-family:var(--serif);font-size:22px;font-weight:600;font-variant-numeric:lining-nums;margin-right:3px}
.cnt{display:inline-flex;align-items:center;gap:4px}
.cnt span{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:lining-nums}

/* Simulering */
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.big .box{text-align:center}
.big .v{font-size:30px;font-weight:600;font-variant-numeric:lining-nums tabular-nums;line-height:1.1}
.big .k{font-family:var(--cap);font-size:13px;letter-spacing:.08em;color:var(--grey)}
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:lining-nums tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--cap);font-weight:400;font-size:13px;letter-spacing:.06em;color:var(--grey)}
.rules{display:grid;gap:8px;margin-top:10px}
.rules label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.rules small{display:block;color:var(--grey);font-style:italic}
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.ref p,.ref li{font-size:15.5px}
.ref ul{margin:0;padding-left:18px;display:grid;gap:4px}
.ladder td,.ladder th{white-space:normal;text-align:left;font-size:14px;vertical-align:top}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bone);padding:8px 16px;border:1px solid var(--blood);border-radius:3px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90vw}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.tok,.toast{transition:none}}
</style>
</head>

const $=s=>document.querySelector(s);

const d6=()=>1+Math.floor(Math.random()*6);

function armorOf(s){ const a=ARMOR[s.rust]||ARMOR.Ingen; const sh=s.skjold&&!weapon(s.vapen).two?1:0;
  return {r:Math.min(4,a.r+sh),base:a.r,byrde:a.b+(sh?2:0),ulP:!!a.ulP&&!s.veteran,ulM:!!sh}; }
function assignTags(f){
  const used=new Set();
  const cand=u=>{ const n=(u.kind==="h"?"Hund":u.navn).trim(); const words=n.split(/\s+/); const num=/^\d+$/.test(words[words.length-1])?words.pop():"";
    const w=words.join(""); const L=[...w].filter(c=>/\p{L}/u.test(c));
    const out=[];
    if(num) out.push((L[0]||"?").toUpperCase()+num);
    out.push((L[0]||"?").toUpperCase());
    for(let i=1;i<L.length;i++) out.push((L[0]||"?").toUpperCase()+L[i].toLowerCase());
    for(let k=2;k<10;k++) out.push((L[0]||"?").toUpperCase()+k);
    return out; };
  f.units.forEach(u=>{ const c=cand(u).find(x=>!used.has(x.toLowerCase())); u.tag=c; used.add(c.toLowerCase()); });
}
function initials(n){ const p=String(n).trim().split(/\s+/); return (p[0]?.[0]||"?")+(p.length>1&&/\d/.test(p[p.length-1])?p[p.length-1]:(p[1]?.[0]||"")); }

function roll(fordel,ulempe,mod){
  const dice=[d6(),d6(),d6(),d6(),d6()];
  let mode="standard"; if(fordel&&!ulempe)mode="fordel"; else if(ulempe&&!fordel)mode="ulempe";
  const idx=[0,1,2,3,4].sort((a,b)=>dice[a]-dice[b]);
  const pick=mode==="fordel"?idx.slice(2):mode==="ulempe"?idx.slice(0,3):idx.slice(1,4);
  const counted=pick.map(i=>dice[i]); const raw=counted.reduce((a,b)=>a+b,0); const sum=raw+(mod||0);
  const grade=sum<=5?"F":sum<=10?"S":sum<=15?"St":"FT";
  return {dice,pick,mode,raw,sum,mod:mod||0,grade,six:counted.includes(6),one:counted.includes(1)};
}

/* ================= ENHETER ================= */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function buildFight(){
  const units=[]; const sc=SCENES[S.scene]||{cols:8,rows:10};
  const seed=Math.floor(Math.random()*1e9); const R=rng(seed);
  const taken=new Set(); const key=(x,y)=>x+","+y;
  const blocked=sceneBlocked(S.scene,sc.cols,sc.rows,seed);
  function place(y0,y1,nearX,nearY){
    for(let t=0;t<200;t++){
      let x,y;
      if(nearX!=null){ x=nearX+Math.floor(R()*3)-1; y=nearY+Math.floor(R()*3)-1; }
      else { x=Math.floor(R()*sc.cols); y=y0+Math.floor(R()*(y1-y0+1)); }
      if(x<0||y<0||x>=sc.cols||y>=sc.rows) continue;
      if(taken.has(key(x,y))||blocked.has(key(x,y))) continue;
      taken.add(key(x,y)); return {x,y};
    }
    return {x:0,y:y0};
  }
  S.roster.forEach(r=>{
    const p=PROF[r.prof]||{L:5,F:5};
    const pos=place(sc.rows-3,sc.rows-1);
    const hasDog=r.prof==="Hundetrener"&&r.hund;
    units.push({id:r.id,kind:"s",navn:r.navn||r.prof,spiller:r.spiller||"",prof:r.prof,w:weapon(r.vapen),mat:r.mat,maxL:p.L,L:p.L,maxF:p.F,F:p.F,bane:0,gal:0,dead:false,fled:false,
      armor:armorOf(r),hasShield:!!(r.skjold&&!weapon(r.vapen).two),shieldOk:true,shieldDropped:false,shieldUsed:false,taktikk:r.taktikk,overtak:false,help:null,tilst:{},act:null,man:null,done:false,dodged:false,x:pos.x,y:pos.y,
      dogId:hasDog?r.id+"h":null,useDog:hasDog,st:{dealt:0,taken:0,hitsIn:0,blocked:0}});
    if(hasDog){
      const dp=place(0,0,pos.x,pos.y);
      units.push({id:r.id+"h",kind:"h",owner:r.id,navn:(r.navn||"Hundetrener")+"s hund",prof:"Hund",w:{n:"Hundebitt",g:2,e:"Kraftig",dog:true},mat:"Vanlig",maxL:4,L:4,maxF:0,F:0,bane:0,gal:0,dead:false,fled:false,
        armor:{r:0,ulP:false,ulM:false},overtak:false,help:null,tilst:{},act:null,man:null,done:true,dodged:false,x:dp.x,y:dp.y,st:{dealt:0,taken:0,hitsIn:0,blocked:0}});
    }
  });
  S.foes.forEach(f=>{ const d=monDef(f.n); if(!d)return;
    for(let i=0;i<f.c;i++){ const pos=place(0,2); units.push({id:"m"+(uid++),kind:"m",dn:d.n,navn:f.c>1?`${d.n} ${i+1}`:d.n,L:d.L,maxL:d.L,dead:false,knocked:false,done:false,x:pos.x,y:pos.y}); }
  });
  if(units.some(u=>u.kind==="m"&&monDef(u.dn).fx==="frykt")) units.forEach(u=>{if(u.kind==="s")u.tilst.Frykt=1;});
  const fr={units,round:0,phase:"velg",over:false,result:null,seed,blocked:[...blocked]}; assignTags(fr); return fr;
}

const liveS=f=>f.units.filter(u=>isS(u)&&!u.dead&&!u.fled);
const liveP=f=>f.units.filter(u=>u.kind==="s"&&!u.dead&&!u.fled);

/* Hva påvirker kastet, med begrunnelse. kind: presse, avvente, unnvik, manover, offer */
function modsFor(f,u,kind,other){
  const Fr=[],Ur=[],P=[];
  const dog=u.useDog&&u.dogId&&f.units.find(d=>d.id===u.dogId&&!d.dead);
  if(kind==="presse"&&u.armor?.ulP&&!dog) Ur.push("tung rustning");
  if((kind==="presse"||kind==="avvente")&&other?.knocked) Fr.push("målet ligger nede");
  if(kind==="unnvik"&&other){ const d=D(other);
    if(d.fx==="bakhold"&&f.round===1) Ur.push("bakhold");
    if(d.fx==="omringer"&&liveM(f).filter(x=>D(x).fx==="omringer").length>=3) Ur.push("omringet av flokken"); }
  if(kind==="manover"&&ulMOf(u)) Ur.push("skjold");

function doAttack(f,s,m,mode,R){

  const notes=[]; let presist=false;

    if(m.L<=0){m.L=0;m.dead=true;notes.push(`<b>${esc(m.navn)} faller</b>`);

  if(R.spesial&&r.one&&!m.dead&&!hitter.dead&&!canHit) out.push(`Tellende 1'er, men ${esc(m.navn)} når ikke fram: spesialen venter`);

    if(PASSIVE_SP.has(D(m).n)) out.push(`Tellende 1'er utløser spesialen: <b>${esc(D(m).sp)}</b>. Den er ikke et angrep, GM bruker den i fiksjonen`);

  }

function doMonster(f,m,s,R){

/* Automatisk runde (brukes av simulering og «Spill runden») */
function autoRound(f,R){
  const ev=[];
  f.round++; f.units.forEach(u=>{u.done=false;u.dodged=false;u.act=null;});
  liveP(f).forEach(u=>{u.act=chooseAct(u); u.useDog=!!(u.dogId&&f.units.find(d=>d.id===u.dogId&&!d.dead));});
  for(const s of liveP(f).filter(u=>u.act==="presse")){ const t=liveM(f)[0]; if(!t||s.dead)continue; ev.push(doAttack(f,s,t,"presse",R)); s.done=true; }

function runSim(){
  const N=parseInt($("#nRuns")?.value)||2000; if(!S.roster.length||!S.foes.length){toast("Legg til Søkere og fiender først");return;}

  const keep=S.fight;
  for(let i=0;i<N;i++){ const f=buildFight(); while(!f.over) autoRound(f,S.rules); if(f.result==="win")w++; else if(f.result==="draw")d++; else l++; rs+=f.round;
    f.units.filter(u=>isS(u)).forEach(u=>{const p=per[u.navn]||(per[u.navn]={navn:u.navn,ar:u.armor.r,bane:0,dead:0,taken:0,hits:0,blk:0}); p.bane+=u.bane;p.dead+=u.dead?1:0;p.taken+=u.st.taken;p.hits+=u.st.hitsIn;p.blk+=u.st.blocked;}); }
  S.fight=keep;
  const pc=x=>Math.round(100*x/N);
  S.sim={n:N,win:pc(w),lose:pc(l),draw:pc(d),rounds:(rs/N).toFixed(1),rows:Object.values(per).map(p=>({navn:p.navn,ar:p.ar,bane:(p.bane/N).toFixed(2),dead:pc(p.dead),per:p.hits?(p.taken/p.hits).toFixed(2):"–",blk:p.hits?Math.round(100*p.blk/p.hits):0}))};
  render();
}

      <li>Halvering rundes opp overalt.</li>
      <li>Bordet regner ut fordel og ulempe selv: tung rustning gir ulempe på Presse (ikke med Veteran eller når hunden angriper), skjold gir ulempe på Manøver, Offermagi kastes med de tre laveste, bakhold og omringing gir ulempe på unnvik, overtak og hjelp gir fordel eller pluss, og hvert Banesår gir −1. Årsaken vises før og etter kastet.</li>
      <li>Slitasje (forslag, av som standard): når rustningen stopper hele treffet, mister den 1 i vern til trefningen er over. Bygger på slitasjeavsnittet og reparasjonstabellen i manuset.</li>
      <li>En tellende 1'er utløser spesialen, uansett resultat. Det gjelder angrep og unnvikelse. Er spesialen et angrep (Råtegrep, Gravkulde, Drukning og lignende), regnes den som et ekstra angrep med grunnskaden. Er den ikke et angrep (Ærend, Steinhud, Omringer, Bakhold, Kommando), vises den bare, og GM bruker den i fiksjonen.</li>
      <li>Drøm- og Fatning-skade går mot Fatning. Kosmisk går mot Legeme. Ingen stoppes av rustning.</li>
      <li>Hunden handler på Hundetrenerens tur i stedet for hennes våpen: grunnskade 2, slår til bakken ved Fulltreffer. Reaksjoner rammer hunden. Hunden har Legeme 4.</li>
      <li>Posisjon: Feilslag gir ulempe på neste kast, Fulltreffer gir fordel. Offermagi viser bare utfallet, virkningen står i ritualet.</li>
      <li>Tilstander telles, men gir ingen straff ennå.</li>
      <li>Rekkevidde på kartet er et forslag: nærkamp 1 rute, hellebard 2, kastekniv og spyd 3, kortbue 6, langbue 9. Manuset sier at fiksjonen avgjør avstand. Bordet viser sonen, men stopper ikke et angrep utenfor.</li></ul></div>
  </div></section>`;
}

/* ================= HENDELSER ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-do],[data-set],[data-act],[data-adj],[data-dels],[data-foe],[data-dog],[data-scene],[data-pg],[data-pick],[data-rtog],[data-rinfo],[data-rset]"); if(!t) return;
  const ds=t.dataset;
  if(ds.go) return go(ds.go);
  if(ds.set){ const [id,a]=ds.set.split(":"); const u=U(id); u.act=a; if(a==="manover"&&!u.man)u.man={k:"posisjon"}; save(); return render(); }
  if(ds.pg!==undefined){ const p=PREGENS[+ds.pg]; if(S.roster.length<5&&!S.roster.some(r=>r.navn===p.navn)){ const {lag,...o}=p; S.roster.push(mkS(o)); S.fight=null; save(); } return render(); }
  if(ds.rtog){ S.rules[ds.rtog]=!S.rules[ds.rtog]; save(); toast(`${RULES.find(r=>r.id===ds.rtog).label}: ${S.rules[ds.rtog]?"på":"av"}`); return render(); }
  if(ds.rinfo){ S.ruleOpen=S.ruleOpen===ds.rinfo?null:ds.rinfo; return render(); }
  if(ds.rset){ const [id,v]=ds.rset.split(":"); if(id==="skjold") S.rules.skjold=v; else S.rules[id]=v==="1"; save(); return render(); }
  if(ds.pick){ S.sel=S.sel===ds.pick?null:ds.pick; return render(); }
  if(ds.scene){ S.scene=ds.scene; return newFight(); }
  if(ds.act) return act(ds.act);
  if(ds.dog){ const [id,v]=ds.dog.split(":"); U(id).useDog=v==="1"; save(); return render(); }
  if(ds.adj){ const [id,n]=ds.adj.split(":"); const u=U(id); u.L=Math.max(0,Math.min(u.maxL,u.L+(+n))); if(u.kind==="m")u.dead=u.L<=0; save(); return render(); }
  if(ds.dels){ S.roster=S.roster.filter(r=>r.id!==ds.dels); S.fight=null; save(); return render(); }
  if(ds.foe){ const [n,d]=ds.foe.split(":"); const f=S.foes.find(x=>x.n===n); if(f){f.c=Math.max(0,Math.min(8,f.c+(+d))); if(!f.c)S.foes=S.foes.filter(x=>x!==f);} else if(+d>0) S.foes.push({n,c:1}); S.fight=null; save(); return render(); }
  switch(ds.do){
    case "new": return newFight();
    case "next": { const f=F(); if(f.phase==="velg"){ liveS(f).forEach(u=>{ if(u.act==="manover"&&MAN[u.man?.k]?.tgt==="ally"&&!u.man.target){ const o=liveS(f).find(x=>x.id!==u.id); if(o)u.man.target=o.id; } }); } return advance(); }
    case "auto": return playRoundAuto();
    case "all": return actAll();
    case "extra": { const f=F(); const o=liveM(f).find(m=>D(m).fx!=="kommando"); if(o&&f.live&&!inReachList(f,o).length) monAdvance(f,o); const tg=f.live&&o?inReachList(f,o):liveS(f); if(o&&tg.length){ const e2=doMonster(f,o,tg[Math.floor(Math.random()*tg.length)],S.rules); e2.title+=" (Kommando)"; logEv(e2); f.extra=false; checkEnd(f); save(); render(); } return; }
    case "clearlog": S.log=[]; save(); return render();
    case "addS": S.roster.push(mkS({navn:"Søker "+(S.roster.length+1),prof:"Duelist",vapen:"Korde",rust:"Lett"})); S.fight=null; save(); return render();
    case "sim": return runSim();
  }
});
function setSpiller(id,v){ v=v.trim().slice(0,18); const r=S.roster.find(x=>x.id===id); if(r) r.spiller=v; const f=S.fight; if(f&&f.units){ const u=f.units.find(x=>x.id===id); if(u) u.spiller=v; } save(); }
document.addEventListener("input",e=>{ const t=e.target; if(t.dataset&&t.dataset.spiller!==undefined) setSpiller(t.dataset.spiller,t.value); });
document.addEventListener("change",e=>{
  const t=e.target, ds=t.dataset;
  if(ds.spiller!==undefined){ setSpiller(ds.spiller,t.value); return render(); }
  if(t.id==="scene"){ S.scene=t.value; save(); return render(); }
  if(ds.tgt){ const u=U(ds.tgt); u.target=t.value||null; save(); return render(); }
  if(ds.man){ const u=U(ds.man); u.man={k:t.value,target:null}; if(MAN[t.value]?.tgt==="ally"){const o=t.value==="forstehjelp"?u:liveS(F()).find(x=>x.id!==u.id); if(o)u.man.target=o.id;} save(); return render(); }
  if(ds.help){ const u=U(ds.help); u.man.target=t.value; save(); return; }
  if(ds.rule){ S.rules[ds.rule]=t.checked; save(); return; }
  if(t.dataset.rshield!==undefined){ S.rules.skjold=t.value; save(); return render(); }
  if(ds.r){ const [id,k]=ds.r.split(":"); const r=S.roster.find(x=>x.id===id); r[k]=t.type==="checkbox"?t.checked:t.value; S.fight=null; save(); return render(); }
});

document.getElementById("logo").src=ART.logo;
load();
if(S.fight && !S.fight.units) S.fight=null;
render();
</script>
